# POCOX rustfmt configuration.
#
# Applies the rustfmt settings of the Google Rust Style Guide
# (https://google.github.io/styleguide/rustguide.html): `max_width = 100`,
# `imports_granularity = "Module"`, `hex_literal_case = "Lower"` and
# `format_macro_matchers = true`. Several options are nightly-only, which is
# why `rust-toolchain.toml` pins a nightly. Run `cargo fmt` with the explicit
# package list in AGENTS.md › Verification, never `cargo fmt --all`.

# === Basics ===
edition = "2021"
max_width = 100
hard_tabs = false
tab_spaces = 4

# === Imports ===
# One module per `use` statement: no `::` inside `{..}`.
imports_granularity = "Module"
group_imports = "StdExternalCrate"
reorder_imports = true

# === Style ===
use_small_heuristics = "Max"
fn_single_line = false
where_single_line = false
struct_lit_single_line = false

# === Punctuation ===
trailing_comma = "Vertical"
match_block_trailing_comma = true

# === Comments / docs ===
normalize_comments = true
normalize_doc_attributes = true
wrap_comments = true
comment_width = 80

# === Whitespace ===
spaces_around_ranges = false
space_before_colon = false
space_after_colon = true
blank_lines_upper_bound = 2
blank_lines_lower_bound = 0

# === Chains ===
chain_width = 60
overflow_delimited_expr = true

# === Macros / strings ===
format_macro_matchers = true
format_macro_bodies = true
format_strings = true
hex_literal_case = "Lower"

# === Misc ===
merge_derives = true
use_try_shorthand = true
use_field_init_shorthand = true
force_explicit_abi = true
newline_style = "Unix"
