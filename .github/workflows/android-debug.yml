# Fork-only helper: build an installable debug APK without repository secrets.
name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-debug

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"
  RUST_TOOLCHAIN: nightly-2026-06-01

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-debug
      - name: Build debug APKs
        working-directory: apps/flutter
        run: |
          flutter pub get
          flutter build apk --debug --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: pocox-debug-arm64-v8a
          path: apps/flutter/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error